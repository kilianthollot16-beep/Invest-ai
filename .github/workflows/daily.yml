name: INVEST AI - mise à jour quotidienne
on:
  schedule:
    - cron: "30 17 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy yfinance
      - run: python tests/test_engine.py
      - run: python fetch_data.py
      - run: |
          git config user.name "invest-ai-bot" && git config user.email "bot@users.noreply.github.com"
          git add docs/data.json data/reco_log.jsonl
          git diff --cached --quiet || git commit -m "maj données $(date -u +%F)"
          git push
